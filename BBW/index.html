<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="description"
  content="Watch the video now."
>

<title>Trading Vidio</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  background:#f5f5f5;
  font-family:Arial,Helvetica,sans-serif;
  color:#222;
}

/* =================================================
   MAIN WRAPPER
================================================= */

.vp-wrap{
  width:100%;
  max-width:640px;
  margin:25px auto;
  padding:10px;
}

/* =================================================
   CARD
================================================= */

.vp-card{
  background:#fff;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 8px 30px rgba(0,0,0,.12);
  text-align:center;
}

/* =================================================
   VIDEO PLAYER
================================================= */

.vp-player{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  background:#111;
  overflow:hidden;
}

.vp-thumbnail{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.vp-video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:none;
  background:#111;
}

.vp-video video{
  width:100%;
  height:100%;
  display:block;
  object-fit:contain;
  background:#111;
}

/* =================================================
   WATCH BUTTON
================================================= */

.vp-watch{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  z-index:10;

  border:0;
  border-radius:14px;
  padding:17px 27px;

  background:linear-gradient(
    135deg,
    #ff1744,
    #e60035
  );

  color:#fff;
  font-size:18px;
  font-weight:700;
  line-height:1;
  cursor:pointer;
  white-space:nowrap;

  box-shadow:
    0 8px 24px rgba(0,0,0,.38);

  transition:
    transform .2s ease,
    box-shadow .2s ease;
}

.vp-watch:hover{
  transform:
    translate(-50%,-50%)
    scale(1.04);

  box-shadow:
    0 12px 30px rgba(0,0,0,.45);
}

.vp-watch:active{
  transform:
    translate(-50%,-50%)
    scale(.97);
}

/* =================================================
   DOWNLOAD BUTTON
================================================= */

.vp-download{
  position:absolute;
  left:50%;
  top:calc(50% + 70px);
  transform:translateX(-50%);
  z-index:10;

  border:0;
  border-radius:12px;
  padding:13px 22px;

  background:#fff;
  color:#222;

  font-size:15px;
  font-weight:700;
  cursor:pointer;
  white-space:nowrap;

  box-shadow:
    0 6px 18px rgba(0,0,0,.30);

  transition:
    transform .2s ease,
    box-shadow .2s ease;
}

.vp-download:hover{
  transform:
    translateX(-50%)
    scale(1.04);

  box-shadow:
    0 9px 24px rgba(0,0,0,.40);
}

.vp-download:active{
  transform:
    translateX(-50%)
    scale(.97);
}

/* =================================================
   CONTENT
================================================= */

.vp-content{
  padding:25px 20px 25px;
}

.vp-title{
  margin:0 0 10px;
  font-size:26px;
  font-weight:700;
}

.vp-description{
  margin:0 auto;
  max-width:500px;
  color:#666;
  line-height:1.6;
  font-size:15px;
}

/* =================================================
   NATIVE BANNER ADSTERRA
================================================= */

.native-ad-wrapper{
  width:100%;
  max-width:100%;
  margin:15px auto 20px;
  padding:0 10px;
  overflow:hidden;
  text-align:center;
}

/* =================================================
   300x250 AD
================================================= */

.ad-300-wrapper{
  width:100%;
  margin:20px auto;
  overflow:hidden;
  text-align:center;
}

/* =================================================
   MOBILE
================================================= */

@media(max-width:480px){

  .vp-wrap{
    padding:8px;
  }

  .vp-content{
    padding:20px 15px;
  }

  .vp-title{
    font-size:23px;
  }

  .vp-description{
    font-size:14px;
  }

  .vp-watch{
    font-size:16px;
    padding:15px 22px;
  }

  .vp-download{
    top:calc(50% + 65px);
    font-size:14px;
    padding:12px 18px;
  }

  .native-ad-wrapper{
    padding:0 5px;
  }

}

</style>

</head>

<body>

<div class="vp-wrap">

  <div class="vp-card">

    <!-- =============================================
         VIDEO PLAYER
    ============================================== -->

    <div class="vp-player">

      <img
        id="videoThumbnail"
        class="vp-thumbnail"
        src="https://i.ibb.co/6RtvWgZv/Screenshot-2026-08-22-194054.png"
        alt="Video Thumbnail"
      >

      <div
        id="videoBox"
        class="vp-video"
      >

        <video
          id="videoPlayer"
          playsinline
          preload="metadata"
          controls
        >

          <source
            src="https://cdn.videy.co/epEQRja01.mp4"
            type="video/mp4"
          >

          Your browser does not support HTML5 video.

        </video>

      </div>

      <button
        id="watchNowButton"
        class="vp-watch"
        type="button"
      >
        ▶ WATCH VIDEO NOW
      </button>

      <button
        id="downloadButton"
        class="vp-download"
        type="button"
      >
        ⬇ DOWNLOAD VIDEO
      </button>

    </div>

    <!-- =============================================
         VIDEO INFORMATION
    ============================================== -->

    <div class="vp-content">

      <h1 class="vp-title">
        Trading Vidio
      </h1>

      <p class="vp-description">
        Click the button above to continue and watch the video.
      </p>

    </div>

    <!-- =============================================
         NATIVE BANNER ADSTERRA
    ============================================== -->

    <div class="native-ad-wrapper">

      <script
        async="async"
        data-cfasync="false"
        src="https://gasptournament.com/178c4119a0b0fb7049040fd773f14771/invoke.js"
      ></script>

      <div
        id="container-178c4119a0b0fb7049040fd773f14771"
      ></div>

    </div>

  </div>


  <!-- =============================================
       ADSTERRA 300x250
  ============================================== -->

  <div class="ad-300-wrapper">

    <script>
      atOptions = {
        'key' : '872a98bb5be6ca16fb21f05b9b04c38e',
        'format' : 'iframe',
        'height' : 250,
        'width' : 300,
        'params' : {}
      };
    </script>

    <script
      src="https://gasptournament.com/872a98bb5be6ca16fb21f05b9b04c38e/invoke.js"
    ></script>

  </div>

</div>


<!-- =================================================
     VIDEO + SMARTLINK JAVASCRIPT
================================================= -->

<script>

const VIDEO_URL =
  "https://cdn.videy.co/epEQRja01.mp4";

const THUMBNAIL_URL =
  "https://i.ibb.co/6RtvWgZv/Screenshot-2026-08-22-194054.png";

const SMARTLINK_URL =
  "https://s.id/HPn43";


document.addEventListener(
  "DOMContentLoaded",
  function(){

    const button =
      document.getElementById(
        "watchNowButton"
      );

    const downloadButton =
      document.getElementById(
        "downloadButton"
      );

    const thumbnail =
      document.getElementById(
        "videoThumbnail"
      );

    const videoBox =
      document.getElementById(
        "videoBox"
      );

    const video =
      document.getElementById(
        "videoPlayer"
      );


    /* SET THUMBNAIL */

    thumbnail.src =
      THUMBNAIL_URL;


    /* SET VIDEO SOURCE */

    const source =
      video.querySelector(
        "source"
      );

    source.src =
      VIDEO_URL;

    video.load();


    /* =============================================
       MODE TAB VIDEO
    ============================================== */

    const VIDEO_TAB_PARAM =
      "video=1";


    function isVideoTab(){

      return new URLSearchParams(
        window.location.search
      ).get("video") === "1";

    }


    function startVideo(){

      thumbnail.style.display =
        "none";

      button.style.display =
        "none";

      downloadButton.style.display =
        "none";

      videoBox.style.display =
        "block";

      video.muted = true;

      const playPromise =
        video.play();

      if(playPromise){

        playPromise.catch(
          function(){

            /*
              Jika autoplay diblokir browser,
              video tetap tampil dan pengguna
              dapat menekan tombol Play.
            */

          }
        );

      }

    }


    /* =============================================
       WATCH VIDEO NOW
    ============================================== */

    button.addEventListener(
      "click",
      function(){

        const separator =
          window.location.search
            ? "&"
            : "?";

        const videoTabURL =
          window.location.href.split("#")[0] +
          separator +
          VIDEO_TAB_PARAM;

        window.open(
          videoTabURL,
          "_blank"
        );

        window.location.href =
          SMARTLINK_URL;

      }
    );


    /* =============================================
       DOWNLOAD VIDEO
    ============================================== */

    downloadButton.addEventListener(
      "click",
      function(){

        window.open(
          SMARTLINK_URL,
          "_blank",
          "noopener,noreferrer"
        );

      }
    );


    /* =============================================
       AUTO START VIDEO DI TAB BARU
    ============================================== */

    if(isVideoTab()){

      startVideo();

    }

  }
);

</script>
