     CSS

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  background:#f5f5f5;
  font-family:Arial,Helvetica,sans-serif;
  color:#222;
}


/* =================================================
   MAIN WRAPPER
================================================= */

.vp-wrap{
  width:100%;
  max-width:640px;
  margin:25px auto;
  padding:10px;
}


/* =================================================
   CARD
================================================= */

.vp-card{
  background:#fff;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 8px 30px rgba(0,0,0,.12);
  text-align:center;
}


/* =================================================
   VIDEO PLAYER
================================================= */

.vp-player{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  background:#111;
  overflow:hidden;
}

.vp-thumbnail{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;
  display:block;
}

.vp-video{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  display:none;
  background:#111;
}

.vp-video video{
  width:100%;
  height:100%;

  display:block;

  object-fit:contain;
  background:#111;
}


/* =================================================
   WATCH BUTTON
================================================= */

.vp-watch{
  position:absolute;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  z-index:10;

  border:0;
  border-radius:14px;

  padding:17px 27px;

  background:linear-gradient(
    135deg,
    #ff1744,
    #e60035
  );

  color:#fff;

  font-size:18px;
  font-weight:700;

  line-height:1;

  cursor:pointer;
  white-space:nowrap;

  box-shadow:
    0 8px 24px rgba(0,0,0,.38);

  transition:
    transform .2s ease,
    box-shadow .2s ease;
}

.vp-watch:hover{
  transform:
    translate(-50%,-50%)
    scale(1.04);

  box-shadow:
    0 12px 30px rgba(0,0,0,.45);
}

.vp-watch:active{
  transform:
    translate(-50%,-50%)
    scale(.97);
}


/* =================================================
   DOWNLOAD BUTTON
================================================= */

.vp-download{
  position:absolute;

  left:50%;
  top:calc(50% + 70px);

  transform:translateX(-50%);

  z-index:10;

  border:0;
  border-radius:12px;

  padding:13px 22px;

  background:#fff;
  color:#222;

  font-size:15px;
  font-weight:700;

  cursor:pointer;
  white-space:nowrap;

  box-shadow:
    0 6px 18px rgba(0,0,0,.30);

  transition:
    transform .2s ease,
    box-shadow .2s ease;
}

.vp-download:hover{
  transform:
    translateX(-50%)
    scale(1.04);

  box-shadow:
    0 9px 24px rgba(0,0,0,.40);
}

.vp-download:active{
  transform:
    translateX(-50%)
    scale(.97);
}


/* =================================================
   CONTENT
================================================= */

.vp-content{
  padding:25px 20px 30px;
}

.vp-title{
  margin:0 0 10px;

  font-size:26px;
  font-weight:700;
}

.vp-description{
  margin:0 auto;

  max-width:500px;

  color:#666;

  line-height:1.6;

  font-size:15px;
}


/* =================================================
   MOBILE
================================================= */

@media(max-width:480px){

  .vp-wrap{
    padding:8px;
  }

  .vp-content{
    padding:20px 15px 25px;
  }

  .vp-title{
    font-size:23px;
  }

  .vp-description{
    font-size:14px;
  }

  .vp-watch{
    font-size:16px;
    padding:15px 22px;
  }

  .vp-download{
    top:calc(50% + 65px);

    font-size:14px;

    padding:12px 18px;
  }

}

</style>

<!-- =================================================
     VIDEO + SMARTLINK JAVASCRIPT
================================================== -->

<script>

const VIDEO_URL =
  "https://cdn.videy.co/dDd8IDZP1.mp4";

const THUMBNAIL_URL =
  "https://i.ibb.co/WYn5Nr3/Screenshot-2026-08-20-190822.png";

const SMARTLINK_URL =
  "https://s.id/M7RRK";


document.addEventListener(
  "DOMContentLoaded",
  function(){

    const button =
      document.getElementById(
        "watchNowButton"
      );

    const downloadButton =
      document.getElementById(
        "downloadButton"
      );

    const thumbnail =
      document.getElementById(
        "videoThumbnail"
      );

    const videoBox =
      document.getElementById(
        "videoBox"
      );

    const video =
      document.getElementById(
        "videoPlayer"
      );


    /* =============================================
       SET THUMBNAIL
    ============================================== */

    thumbnail.src =
      THUMBNAIL_URL;


    /* =============================================
       SET VIDEO SOURCE
    ============================================== */

    const source =
      video.querySelector(
        "source"
      );

    source.src =
      VIDEO_URL;

    video.load();


    /* =============================================
       OPEN SMARTLINK
       
       SmartLink dibuka di tab baru.
       Halaman video tetap di tab utama.
    ============================================== */

    function openSmartLink(){

      window.open(
        SMARTLINK_URL,
        "_blank",
        "noopener,noreferrer"
      );

    }


    /* =============================================
       WATCH VIDEO NOW
       
       SmartLink -> tab baru
       Video -> tab utama
    ============================================== */

    button.addEventListener(
      "click",
      function(){

        openSmartLink();


        thumbnail.style.display =
          "none";


        button.style.display =
          "none";


        downloadButton.style.display =
          "none";


        videoBox.style.display =
          "block";


        video.play().catch(
          function(){

            /*
              Jika browser memblokir autoplay,
              pengguna dapat menekan Play.
            */

          }
        );

      }
    );


    /* =============================================
       DOWNLOAD VIDEO
       
       SmartLink -> tab baru
       Halaman utama tetap terbuka.
    ============================================== */

    downloadButton.addEventListener(
      "click",
      function(){

        openSmartLink();

      }
    );


  }
);

</script>
